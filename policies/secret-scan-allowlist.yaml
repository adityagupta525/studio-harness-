# Studio Harness — secret-scan allowlist (v1). Enforced by scripts/scan-secrets.sh; tested in scripts/tests/validator_tests.py.
# The scanner covers EVERY text file in the repo, including raw captures under runs/*/refs/. Nothing is excluded by folder.
# These two rules are the only suppressions. Everything else, including visitor and XSRF values, signed media URLs that carry an
# IP address, cookie headers, auth cookie values, generic key/secret/token/password values and other API keys, is a finding.
# Clean raw captures with scripts/sanitize-captures.sh before they are kept. File-name checks (pem, key, p12, auth.json, .env,
# .netrc, anything with "cookie" in its name, sqlite files) run everywhere and have no allowlist.
version: 1
rules:
  - id: A1
    name: signature-bytes
    covers: an AIza-looking string that sits inside the value of a sig, lsig or signature URL parameter
    why_benign: signatures are random base64; the four letters AIza occasionally appear in them and the string is not a Google key
    limit: only when the characters before the match are a sig, lsig or signature parameter name and equals sign
  - id: A2
    name: public-web-client-key
    covers: the public Google web-client key that every YouTube page embeds, given as INNERTUBE_API_KEY, innertubeApiKey or apiKey
    why_benign: it is a public client identifier shipped to every anonymous visitor, not an account credential
    limit: only in a raw capture, meaning a .html or .json file under a refs folder, and only as the value of those field names
